services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novaseguro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novaseguro_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-novaseguro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novaseguro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novaseguro}:${POSTGRES_PASSWORD:-novaseguro_dev_pw}@postgres:5432/${POSTGRES_DB:-novaseguro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment}
      CORS_ORIGINS: http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  bff:
    build: ./bff
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-novaseguro}:${POSTGRES_PASSWORD:-novaseguro_dev_pw}@postgres:5432/${POSTGRES_DB:-novaseguro}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment}
      JWT_EXPIRES_IN: 7d
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:3000
      AI_BACKEND_URL: http://backend:8000
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BFF_URL: http://localhost:4000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment}
    depends_on:
      - bff
    ports:
      - "3000:3000"

volumes:
  postgres_data:
