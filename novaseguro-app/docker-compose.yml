services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novaseguro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novaseguro_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-novaseguro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novaseguro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novaseguro}:${POSTGRES_PASSWORD:-novaseguro_dev_pw}@postgres:5432/${POSTGRES_DB:-novaseguro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Vazio por padrão: cookie host-only, funciona para um domínio só.
      # Em produção com subdomínio por assinante (ex.: acme.suaempresa.com),
      # defina como ".suaempresa.com" para o cookie de sessão valer em
      # todos os subdomínios.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGINS: http://localhost:3000
      # Ex. em produção: ^https://.*\.suaempresa\.com$
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-novaseguro}
      STORAGE_DIR: /data/documentos
    volumes:
      - documentos_data:/data/documentos
      - ./db:/app/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  documentos_data:
